name: Verify published OceanBond chapters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-oceanbond-chapters-live.yml'
      - '_build/verify_oceanbond_chapters_live.py'
permissions:
  contents: read
concurrency:
  group: oceanbond-chapters-live-check
  cancel-in-progress: false
jobs:
  live-browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Check the public chapters and old bookmarks
        run: python _build/verify_oceanbond_chapters_live.py
      - name: Keep live screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceanbond-chapters-live-verification
          path: chapters-live-verification/
          retention-days: 7
