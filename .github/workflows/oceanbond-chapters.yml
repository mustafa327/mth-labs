name: Build and verify OceanBond chapters
on:
  workflow_dispatch:
  push:
    branches: [oceanbond-gameplay-chapters]
    paths:
      - '_build/chapters/**'
      - 'assets/oceanbond-chapters/page.*'
      - '.github/workflows/oceanbond-chapters.yml'
permissions:
  contents: write
concurrency:
  group: oceanbond-chapters-staging
  cancel-in-progress: false
jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oceanbond-gameplay-chapters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build and browser tools
        run: |
          python -m pip install 'numpy==2.3.5' 'Pillow==12.3.0' 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Build original models and consolidated page
        run: |
          python _build/chapters/build_models.py
          python _build/chapters/prepare_viewer.py
          python _build/chapters/prepare_page.py
          python _build/chapters/finalize.py
          node --check assets/oceanbond-chapters/viewer.js
          node --check assets/oceanbond-chapters/page.js
      - name: Verify models, motion, chapter embeds and mobile layout
        run: python _build/chapters/render_and_verify.py
      - name: Preserve actual browser screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceanbond-chapters-verification
          path: chapters-verification/
          retention-days: 7
      - name: Commit only verified website output to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/oceanbond-chapters oceanbond.html 404.html sitemap.xml _build/raft/verify_live.py
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified chapter models, previews and consolidated OceanBond page'
          git pull --rebase origin oceanbond-gameplay-chapters
          git push origin HEAD:oceanbond-gameplay-chapters
