name: Build OceanBond raft asset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_build/raft/source/build_asset.py'
      - '.github/workflows/build-oceanbond-raft.yml'

permissions:
  contents: write

concurrency:
  group: oceanbond-raft-asset
  cancel-in-progress: false

jobs:
  build-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned asset-building dependencies
        run: python -m pip install 'numpy==2.3.5' 'Pillow==12.3.0' 'scipy==1.17.0'
      - name: Build original geometry, textures and animation
        run: |
          mkdir -p _build/raft/tests oceanbond-raft/assets
          python _build/raft/source/build_asset.py
          cp _build/raft/site/assets/red-sail-raft.glb oceanbond-raft/assets/red-sail-raft.glb
      - name: Validate model and record checksum
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, struct
          p = pathlib.Path('oceanbond-raft/assets/red-sail-raft.glb')
          data = p.read_bytes()
          magic, version, size = struct.unpack_from('<III', data)
          assert magic == 0x46546c67 and version == 2 and size == len(data)
          n, kind = struct.unpack_from('<II', data, 12)
          assert kind == 0x4e4f534a
          model = json.loads(data[20:20+n])
          assert len(model['images']) == 9
          assert len(model['meshes']) == 21
          assert model['animations'][0]['name'] == 'Wind_and_Waves_8s'
          assert len(model['animations'][0]['channels']) == 15
          print('Validated animated raft:', len(data), 'bytes')
          print('SHA256:', hashlib.sha256(data).hexdigest())
          PY
      - name: Commit only the generated website model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- oceanbond-raft/assets/red-sail-raft.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish textured OceanBond raft with embedded animation'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
