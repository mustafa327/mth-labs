name: Verify OceanBond raft deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-oceanbond-raft.yml'
      - '_build/raft/verify_live.py'

permissions:
  contents: read

concurrency:
  group: verify-oceanbond-raft
  cancel-in-progress: false

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser testing tools
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Check the live model, animation, controls and embedded page
        run: python _build/raft/verify_live.py
      - name: Keep verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oceanbond-raft-live-verification
          path: raft-verification/
          retention-days: 7
